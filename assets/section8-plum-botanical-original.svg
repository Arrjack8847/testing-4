<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1000" width="390" height="1000" aria-hidden="true">
<defs>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8e527c" stop-opacity=".29"/><stop offset=".48" stop-color="#652851" stop-opacity=".25"/><stop offset="1" stop-color="#301328" stop-opacity=".6"/></linearGradient>
  <pattern id="grain" width="43" height="37" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="10" r=".8" fill="#e6b7d2" opacity=".10"/><circle cx="27" cy="31" r=".8" fill="#150b13" opacity=".2"/>
  </pattern>
  <g id="frond" fill="none">
    <path d="M9 320 C36 240 25 159 69 71 C94 19 123 1 144 -25" stroke="#271326" stroke-width="5" opacity=".28" transform="translate(2 2)"/>
    <path d="M9 320 C36 240 25 159 69 71 C94 19 123 1 144 -25" stroke="#a15a82" stroke-width="2" opacity=".35"/>
    <g fill="url(#leaf)" stroke="#a56b8b" stroke-width="1.2" stroke-opacity=".42">
      <path d="M29 263 Q-19 234 2 204 Q32 223 29 263Z"/><path d="M33 230 Q75 197 59 171 Q23 192 33 230Z"/>
      <path d="M40 197 Q-2 174 13 148 Q52 160 40 197Z"/><path d="M50 155 Q94 134 84 104 Q47 122 50 155Z"/>
      <path d="M65 119 Q26 97 38 73 Q72 84 65 119Z"/><path d="M82 78 Q127 72 122 37 Q82 46 82 78Z"/>
      <path d="M96 51 Q77 19 94 4 Q117 25 96 51Z"/>
    </g>
    <g stroke="#341629" opacity=".22" fill="none" stroke-width="1.4">
      <path d="M32 259 L3 210 M34 225 L57 174 M40 194 L14 151 M50 152 L81 109 M64 118 L40 75 M83 77 L118 40"/>
    </g>
  </g>
  <g id="littlebloom">
    <path d="M0 -18 C9 -34 18 -19 9 -10 C23 -16 30 -1 13 4 C28 11 16 22 4 13 C1 30 -15 26 -12 10 C-29 16 -26 -3 -11 -5 C-22 -19 -7 -30 0 -18Z" fill="#673354" opacity=".48" stroke="#a77693" stroke-opacity=".33" stroke-width="1"/>
    <circle r="5" fill="#9c638b" opacity=".3"/>
  </g>

  <!-- Independently drawn velvet grain and soft relief, not a reference image. -->
  <filter id="velvetNoise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".038 .070" numOctaves="3" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="relief" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="1.6" dy="2.0" stdDeviation="1.2" flood-color="#100910" flood-opacity=".83"/>
    <feDropShadow dx="-1.1" dy="-1.3" stdDeviation=".85" flood-color="#d4aac1" flood-opacity=".33"/>
  </filter>
</defs>
<!-- A deep plum relief background, designed independently from source imagery. -->
<rect width="390" height="1000" fill="#321c18" opacity=".58"/>
<rect width="390" height="1000" filter="url(#velvetNoise)" opacity=".22" style="mix-blend-mode:overlay"/>
<rect width="390" height="1000" fill="url(#grain)"/>
<g opacity=".94" filter="url(#relief)">
  <use href="#frond" transform="translate(-34 20) rotate(-11 20 155)"/>
  <use href="#frond" transform="translate(380 190) scale(-1 .85) rotate(-14 40 180)"/>
  <use href="#frond" transform="translate(-36 560) rotate(8 20 175)"/>
  <use href="#frond" transform="translate(401 660) scale(-1 .91) rotate(10 25 190)"/>
  <use href="#frond" transform="translate(65 635) scale(.64 .8) rotate(-18 40 80)" opacity=".68"/>
  <use href="#frond" transform="translate(267 325) scale(.56 .65) rotate(17 60 70)" opacity=".5"/>
  <use href="#frond" transform="translate(187 99) scale(.65 .5) rotate(65 40 70)" opacity=".54"/>
</g>
<g opacity=".70" filter="url(#relief)">
<use href="#littlebloom" transform="translate(69 52) scale(1.8)"/>
<use href="#littlebloom" transform="translate(327 284) scale(1.2)"/>
<use href="#littlebloom" transform="translate(110 677) scale(1.7)"/>
<use href="#littlebloom" transform="translate(300 809) scale(1.5)"/>
<use href="#littlebloom" transform="translate(29 895) scale(1.2)"/>
</g>
</svg>