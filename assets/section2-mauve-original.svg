<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 762" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Original, procedural embossed-paper overlay. No vendor images or vectors. -->
  <defs>
    <filter id="fiber" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".095 .13" numOctaves="4" seed="37" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="contrast">
        <feFuncR type="linear" slope="2.15" intercept="-.575"/>
        <feFuncG type="linear" slope="1.6" intercept="-.3"/>
        <feFuncB type="linear" slope="1.6" intercept="-.3"/>
        <feFuncA type="linear" slope=".7"/>
      </feComponentTransfer>
    </filter>
    <filter id="relief" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .038" numOctaves="3" seed="11" result="height"/>
      <feDiffuseLighting in="height" surfaceScale="21" diffuseConstant=".95" lighting-color="#e5cddd" result="light">
        <feDistantLight azimuth="315" elevation="49"/>
      </feDiffuseLighting>
      <feComponentTransfer in="light">
        <feFuncA type="linear" slope=".53"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="luster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7b4c7" stop-opacity=".52"/>
      <stop offset=".32" stop-color="#513749" stop-opacity=".12"/>
      <stop offset=".65" stop-color="#e8c7df" stop-opacity=".45"/>
      <stop offset="1" stop-color="#4d3149" stop-opacity=".25"/>
    </linearGradient>
    <path id="stem" d="M-38,-22 C44,1 8,63 59,104 C101,141 28,189 77,246 C94,266 98,283 76,309" fill="none"/>
    <g id="sprig" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10,38 C48,58 20,101 55,132 S63,212 89,267"/>
      <path d="M22,68 C16,51 4,47 -4,49 C-13,61 2,75 22,68Z"/>
      <path d="M32,92 C53,77 66,85 63,97 C56,107 43,106 32,92Z"/>
      <path d="M43,117 C20,104 7,115 12,129 C23,133 34,128 43,117Z"/>
      <path d="M55,159 C80,136 88,147 86,159 C78,171 68,167 55,159Z"/>
      <path d="M52,189 C31,172 16,186 27,199 C37,206 46,197 52,189Z"/>
      <path d="M68,222 C88,209 100,213 99,228 C87,238 76,232 68,222Z"/>
      <path d="M9,38 C30,34 40,25 44,11"/>
      <path d="M60,130 C70,135 82,137 92,126"/>
      <path d="M67,251 C78,260 81,281 71,292"/>
    </g>
    <g id="curl" fill="none" stroke-linecap="round">
      <path d="M-15,80 Q75,20 94,91 C117,152 21,167 27,125 C28,103 51,100 62,119"/>
      <path d="M10,177 Q110,101 125,200 C132,238 83,268 72,238 C66,215 95,213 99,228"/>
      <path d="M-24,266 C38,244 57,305 78,319 C105,341 129,325 134,304"/>
    </g>
    <!-- Original linen grain and hand-embossed ornament. -->
    <filter id="linen" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".42 .34" numOctaves="2" seed="91" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.3" intercept="-.15"/>
        <feFuncG type="linear" slope="1.3" intercept="-.15"/>
        <feFuncB type="linear" slope="1.3" intercept="-.15"/>
        <feFuncA type="linear" slope=".45"/>
      </feComponentTransfer>
    </filter>
    <g id="wrought-branch" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,10 C35,38 12,92 41,133 C64,163 47,205 71,237"/>
      <path d="M16,49 C2,33 -7,31 -16,42 C-12,62 4,64 16,49Z"/>
      <path d="M25,90 C44,67 61,76 54,94 C44,108 33,100 25,90Z"/>
      <path d="M31,129 C3,111 -6,129 10,145 C19,148 26,137 31,129Z"/>
      <path d="M47,167 C60,146 83,148 80,168 C71,178 54,174 47,167Z"/>
      <path d="M57,205 C30,190 27,209 41,222 C49,228 55,213 57,205Z"/>
      <path d="M30,72 C46,61 46,42 49,30 M39,137 C65,127 68,114 69,104"/>
    </g>
    <g id="woven-medallion" fill="none" stroke-linejoin="round">
      <path d="M0,-19 Q5,-10 13,-13 Q10,-5 19,0 Q10,5 13,13 Q5,10 0,19 Q-5,10 -13,13 Q-10,5 -19,0 Q-10,-5 -13,-13 Q-5,-10 0,-19Z"/>
      <path d="M0,-13 L13,0 L0,13 L-13,0Z"/>
      <path d="M0,-7 L7,0 L0,7 L-7,0Z"/>
    </g>
  </defs>
  <rect width="390" height="762" fill="#68455a"/>
  <rect width="390" height="762" fill="#b99db0" filter="url(#fiber)" opacity=".25"/>
  <rect width="390" height="762" fill="#988094" filter="url(#relief)" opacity=".20"/>
  <rect width="390" height="762" fill="url(#luster)" opacity=".13"/>
  <rect width="390" height="762" fill="#d7bdce" filter="url(#linen)" opacity=".20"/>
  <!-- Original stamped botanical relief, shaded as pressed fabric. -->
  <g stroke="#332132" stroke-width="1.65" opacity=".045" transform="translate(1.1 1.4)">
    <use href="#wrought-branch" transform="translate(21 92) scale(1.22)"/>
    <use href="#wrought-branch" transform="translate(375 712) rotate(180) scale(1.25)"/>
    <use href="#wrought-branch" transform="translate(320 30) rotate(17) scale(.86)"/>
    <use href="#woven-medallion" transform="translate(105 112) rotate(14)"/>
    <use href="#woven-medallion" transform="translate(275 457) rotate(9) scale(.82)"/>
  </g>
  <g stroke="#ead1e0" stroke-width="1.1" opacity=".055" transform="translate(-.8 -.9)">
    <use href="#wrought-branch" transform="translate(21 92) scale(1.22)"/>
    <use href="#wrought-branch" transform="translate(375 712) rotate(180) scale(1.25)"/>
    <use href="#wrought-branch" transform="translate(320 30) rotate(17) scale(.86)"/>
    <use href="#woven-medallion" transform="translate(105 112) rotate(14)"/>
    <use href="#woven-medallion" transform="translate(275 457) rotate(9) scale(.82)"/>
  </g>
  <!-- Gentle irregular fiber creases characteristic of embossed handmade paper. -->
  <g fill="none" stroke-linecap="round">
    <path d="M192,-18 C179,102 195,207 185,314 S174,580 183,792" stroke="#342333" stroke-width="1.6" opacity=".055"/>
    <path d="M194,-18 C181,102 197,207 187,314 S176,580 185,792" stroke="#e9cada" stroke-width="1" opacity=".060"/>
    <path d="M344,-10 C357,106 343,263 358,386 S359,641 351,790" stroke="#39273a" stroke-width="1" opacity=".05"/>
  </g>
  <!-- Broad asymmetrical creases add the low-frequency relief missing from grain-only paper.
       Original paths; paired lowlights/highlights remain subtle behind live wording. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M87,-17 C105,41 74,98 93,145 S106,232 92,299 S107,420 99,495 S112,612 92,785"
      stroke="#26172c" stroke-width="2.8" opacity=".14"/>
    <path d="M91,-17 C109,41 78,98 97,145 S110,232 96,299 S111,420 103,495 S116,612 96,785"
      stroke="#e6c5d5" stroke-width="1.9" opacity=".18"/>
    <path d="M288,-23 C275,69 305,148 278,217 S295,319 283,384 S264,520 292,593 S291,705 273,790"
      stroke="#2b182d" stroke-width="3.1" opacity=".12"/>
    <path d="M292,-23 C279,69 309,148 282,217 S299,319 287,384 S268,520 296,593 S295,705 277,790"
      stroke="#f1d8e2" stroke-width="2" opacity=".16"/>
    <path d="M-30,277 C51,258 66,276 115,302 S214,327 267,288 S352,265 423,279"
      stroke="#2b1c30" stroke-width="1.5" opacity=".065"/>
    <path d="M-30,281 C51,262 66,280 115,306 S214,331 267,292 S352,269 423,283"
      stroke="#edd1df" stroke-width="1" opacity=".07"/>
  </g>
  <!-- Embossed scrolling foliage is kept mainly along the margins. -->
  <g stroke="#321f31" opacity=".05" stroke-width="4" transform="translate(1 2)">
    <use href="#sprig"/><use href="#curl" transform="translate(-26 178) scale(.68)"/>
    <use href="#sprig" transform="translate(389 759) rotate(180)"/>
    <use href="#curl" transform="translate(416 543) rotate(182) scale(.7)"/>
  </g>
  <g stroke="#d7bbcd" opacity=".13" stroke-width="2.1">
    <use href="#sprig"/><use href="#curl" transform="translate(-26 178) scale(.68)"/>
    <use href="#sprig" transform="translate(389 759) rotate(180)"/>
    <use href="#curl" transform="translate(416 543) rotate(182) scale(.7)"/>
  </g>
  <g stroke="#e8cedd" opacity=".075" stroke-width="1.2" fill="none">
    <path d="M-15,447 Q21,413 49,427 T84,460 Q96,501 67,513 Q51,517 53,492"/>
    <path d="M405,304 Q363,289 345,314 T305,356 Q315,387 340,377 Q357,362 342,352"/>
    <path d="M-15,586 Q40,561 58,601 Q70,635 103,627"/>
    <path d="M406,664 Q365,649 343,682 Q326,708 303,703"/>
  </g>
</svg>
