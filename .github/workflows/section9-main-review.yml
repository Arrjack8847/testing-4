name: Section 9 main integration QA
on:
  push:
    branches: [feat/section9-main-visual-integration-20261104, main]
    paths:
      - index.html
      - section-nine.css
      - section-nine.js
      - section-ten.css
      - tests/section-nine.spec.mjs
      - tests/section-ten.spec.mjs
      - .github/workflows/section9-main-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  section9-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Validate script syntax
        run: node --check reference-continuation.js && node --check section-nine.js && node --check section-ten.js
      - name: Run real RSVP API and privacy tests
        run: python3 -m unittest discover -s tests -p 'test_rsvp_api.py'
      - name: Four-phone Section 8–9–10 suite
        run: npx playwright test tests/section-nine.spec.mjs tests/section-ten.spec.mjs tests/section-six.spec.mjs --workers=2
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section9-main-review
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
