name: Design 5 scene from uploaded artwork

on:
  push:
    branches:
      - art/design5-scene-composite-20261112
    paths:
      - tools/design5_compose_scene.py
      - .github/workflows/design5-compose-scene.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  composite:
    if: github.ref == 'refs/heads/art/design5-scene-composite-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image compositing dependency
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Review 26 artwork files and generate scene.webp
        run: python tools/design5_compose_scene.py
      - name: Verify exact scene output and file audit
        run: |
          python - <<'PY'
          from PIL import Image
          import json
          from pathlib import Path
          scene=Path('assets/skins/golden-pagoda-garden/scene.webp')
          report=json.loads(Path('design5/review/asset-audit.json').read_text())
          with Image.open(scene) as im:
              assert im.format=='WEBP'
              assert im.size==(1080,1920)
          assert report['file_count']==26
          print('PASS: all 26 sources accounted for, 1080x1920 WEBP created')
          PY
      - name: Commit the actual image and QA report to preview branch only
        env:
          TARGET_BRANCH: art/design5-scene-composite-20261112
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skins/golden-pagoda-garden/scene.webp design5/review/asset-audit.json design5/review/scene-preview.jpg
          if git diff --cached --quiet; then
            echo 'No changes to composite.'
          else
            git commit -m "art(design5): composite still scene from uploaded assets"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
