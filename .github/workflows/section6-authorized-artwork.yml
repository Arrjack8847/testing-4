name: Section 6 authorized artwork discovery
on:
  push:
    branches:
      - feat/section6-dress-code-reference-20261103
    paths:
      - tools/section6-authorized-artwork-audit.cjs
      - .github/workflows/section6-authorized-artwork.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site tooling
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Discover exact Dress Code art resources
        run: node tools/section6-authorized-artwork-audit.cjs
      - name: Upload text-only source asset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section6-authorized-artwork-manifest
          path: artifacts/section6-authorized-artwork/manifest-audit.json
          if-no-files-found: warn
          retention-days: 7
