name: Measure live mobile reference
on:
  push:
    paths:
      - tools/measure-live-reference.mjs
      - .github/workflows/measure-live-reference.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inspection dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspect 390 x 844 portrait layout and opening state
        run: node tools/measure-live-reference.mjs
