name: Inspect reference decorative motion
on:
  push:
    paths:
      - tools/inspect-decoration-motion.py
      - .github/workflows/decorative-motion.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/inspect-decoration-motion.py
