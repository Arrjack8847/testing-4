name: Research live reference Section 2 (read-only)
on:
  push:
    paths:
      - tools/inspect-reference-section2.mjs
      - .github/workflows/inspect-reference-section2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture live reference structure, scroll scenes and typography
        run: node tools/inspect-reference-section2.mjs
      - name: Save reference-only inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-section2-inspection
          path: reference-section2-evidence/
          retention-days: 5
          if-no-files-found: warn
