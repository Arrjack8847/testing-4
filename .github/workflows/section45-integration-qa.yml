name: Integrated Section 4 to 5 mobile QA
on:
  push:
    branches:
      - integration/section4-to-order-reference-20261104
  pull_request:
    paths:
      - index.html
      - order-program.css
      - order-program.js
      - section-three.css
      - section-three.js
      - tests/section5-order-of-day.spec.mjs
      - tests/section-four.spec.mjs
      - tests/section-five.spec.mjs
      - tests/section-three.spec.mjs
      - tests/section-couple.spec.mjs
      - .github/workflows/section45-integration-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  order-four-phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Validate syntax and Order / Events / Gallery across four phones
        run: |
          npm run test:syntax
          npx playwright test tests/section5-order-of-day.spec.mjs tests/section-four.spec.mjs tests/section-five.spec.mjs --workers=2
      - name: Upload Order and boundary screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section45-order-four-phone
          path: |
            test-results/
          retention-days: 5
          if-no-files-found: warn

  preserved-couple-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Download opening artwork for isolated test runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen,Request
          import re
          names=re.findall(r'^([a-z0-9_]+\.webp)$',Path('ASSET-MANIFEST.txt').read_text(),re.M)
          assert len(names)==25
          Path('assets').mkdir(exist_ok=True)
          for name in names:
              data=urlopen(Request('https://undangankahwin.com/images/concierge/packs/tasik-kayangan/'+name,headers={'User-Agent':'Mozilla/5.0'}),timeout=45).read()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              Path('assets',name).write_bytes(data)
          PY
      - name: Validate approved Couple / Events and 1→2 transition on four phones
        run: npx playwright test tests/section-couple.spec.mjs tests/section-three.spec.mjs tests/section1-2-handoff.spec.mjs --workers=2
      - name: Upload regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section45-preserved-couple-events
          path: test-results/
          retention-days: 5
          if-no-files-found: warn
