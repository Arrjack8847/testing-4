name: Sections 3–6 integrated mobile QA
on:
  push:
    branches:
      - feat/section3456-integration-preview-20261104
    paths:
      - index.html
      - order-program.js
      - order-program.css
      - dress-code.js
      - dress-code.css
      - tests/section3456-integration.spec.mjs
      - tests/section-three.spec.mjs
      - tests/section-four.spec.mjs
      - tests/section-five.spec.mjs
      - tests/section-six.spec.mjs
      - tests/section5-order-of-day.spec.mjs
      - tests/section-six-dress.spec.mjs
      - .github/workflows/section3456-integration-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Stage opening-scene assets in test checkout only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import re
          names=re.findall(r'^([a-z0-9_]+\.webp)$',Path('ASSET-MANIFEST.txt').read_text(),re.M)
          assert len(names)==25
          Path('assets').mkdir(exist_ok=True)
          for name in names:
            data=urlopen(Request('https://undangankahwin.com/images/concierge/packs/tasik-kayangan/'+name,headers={'User-Agent':'Mozilla/5.0'}),timeout=45).read()
            assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
            Path('assets',name).write_bytes(data)
          PY
      - run: npm run test:syntax
      - name: Sections 3 to 8 regression including calibrated Section 5 and Dress Code
        run: |
          npx playwright test tests/section3456-integration.spec.mjs tests/section-couple.spec.mjs tests/section-three.spec.mjs tests/section-four.spec.mjs tests/section5-order-of-day.spec.mjs tests/section-six-dress.spec.mjs tests/section-five.spec.mjs tests/section-six.spec.mjs --workers=2
      - name: Upload screenshots and Playwright failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section3456-integrated-four-phones
          path: |
            test-results/**/*.png
            test-results/**/*.zip
          retention-days: 7
          if-no-files-found: warn
