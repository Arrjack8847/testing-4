name: Measure live wedding hero typography
on:
  push:
    paths:
      - tools/measure-live-typography.mjs
      - .github/workflows/measure-live-typography.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tools/measure-live-typography.mjs
