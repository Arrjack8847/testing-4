name: Section 5 running order reference QA
on:
  push:
    branches: [feat/section5-order-of-day-reference-20261103]
    paths:
      - index.html
      - order-program.js
      - order-program.css
      - tests/section5-order-of-day.spec.mjs
      - tests/section-four.spec.mjs
      - tests/section-five.spec.mjs
      - package.json
      - .github/workflows/section5-order-of-day-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  running-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:syntax
      - name: Order + Events + Gallery across four phones
        run: npx playwright test tests/section5-order-of-day.spec.mjs tests/section-four.spec.mjs tests/section-five.spec.mjs --workers=2
      - name: Save visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section5-order-of-day-visual-qa
          path: |
            test-results/**/*.png
            test-results/**/*.zip
          retention-days: 7
          if-no-files-found: warn
