name: Myanmar Palace Minimal Centering QA
on:
  pull_request:
    paths:
      - tools/myanmar-palace-minimal-center.py
      - .github/workflows/myanmar-palace-minimal-center.yml
      - assets/skins/myanmar-luxury/palace.webp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image and mobile browser tools
        run: |
          python -m pip install pillow numpy
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start local mobile preview
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/palace-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/index.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Capture original palace at cover / opened / scroll
        run: node tools/myanmar-priority1-preview.mjs baseline
      - name: Measure roof apex and shift only image pixels
        run: python tools/myanmar-palace-minimal-center.py
      - name: Capture recentered palace with identical runtime geometry
        run: node tools/myanmar-priority1-preview.mjs candidate
      - name: Log before / after small screenshots
        run: python tools/myanmar-priority1-thumbs.py
      - name: Upload visual comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-palace-centering-comparison
          path: candidate-screens/
          if-no-files-found: warn
          retention-days: 14
