name: Section 9 to 10 isolated integration QA
on:
  push:
    branches: [integration/section9-10-closing-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seam:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check Section 9 and Section 10 JavaScript syntax
        run: node --check section-nine.js && node --check section-ten.js
      - name: Four-phone Section 8→9→10 regression and independent camera tests
        run: npx playwright test tests/section-nine.spec.mjs tests/section-ten.spec.mjs --workers=2
      - name: Upload source-independent local screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section9-10-integration-qa
          path: |
            test-results/**/*.png
            test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 7
