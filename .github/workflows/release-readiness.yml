name: Phase 19 release readiness (non-deploying)
on:
  workflow_dispatch:
  push:
    paths:
      - tools/check-release.py
      - ASSET-MANIFEST.txt
      - index.html
      - scene.js
      - styles.css
      - assets/**
      - .github/workflows/release-readiness.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate self-hosted artwork before commercial publication
        run: python3 tools/check-release.py
