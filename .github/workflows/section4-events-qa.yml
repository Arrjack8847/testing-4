name: Section 4 reference Events mobile QA
on:
  push:
    branches:
      - feat/section4-events-reference-prototype-20261103
    paths:
      - index.html
      - section-three.css
      - section-three.js
      - tests/section-three.spec.mjs
      - tests/section-four.spec.mjs
      - tests/section-couple.spec.mjs
      - tests/cross-browser.spec.mjs
      - .github/workflows/section4-events-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  events-four-phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Load existing opening scene WebPs for this test checkout only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import re
          names=re.findall(r'^([a-z0-9_]+\.webp)$',Path('ASSET-MANIFEST.txt').read_text(),re.M)
          assert len(names)==25
          Path('assets').mkdir(exist_ok=True)
          for name in names:
              url='https://undangankahwin.com/images/concierge/packs/tasik-kayangan/'+name
              data=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=45).read()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              Path('assets',name).write_bytes(data)
          print('Existing artwork available ephemerally for Section 1/2 regression tests.')
          PY
      - run: npm run test:syntax
      - name: Section 4 + adjacent-section regression across four phones
        run: npx playwright test tests/section-three.spec.mjs tests/section-four.spec.mjs tests/section-couple.spec.mjs --workers=2
      - name: Upload Section 4 scroll/camera/screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section4-events-320-360-390-430
          path: |
            test-results/**/*section4-events*.png
            test-results/**/*section3-to-4-events*.png
            test-results/**/*section-three*.png
            test-results/**/*.zip
          retention-days: 7
          if-no-files-found: warn
