name: Check mobile opening scene
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check scene.js
      - name: Validate scene and artwork references
        run: python3 tools/check-source.py
