name: Compare Section 5 live source and local
on:
  push:
    branches: [feat/section5-order-of-day-reference-20261103]
    paths:
      - tools/compare-section5-live.mjs
      - .github/workflows/section5-order-live-compare.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Compare published reference and local timeline
        run: node tools/compare-section5-live.mjs
      - name: Upload source-vs-local evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section5-source-vs-local
          path: section5-live-evidence/
          retention-days: 7
          if-no-files-found: warn
