name: Section 7 reference screenshot evidence (Chromium)
on:
  push:
    branches:
      - feat/section7-reference-validation-20261104
    paths:
      - .github/workflows/section7-screenshot-evidence.yml
      - tools/section7-method-audit.mjs
      - tools/section7-screenshot-compare.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    name: Four-size Gallery artwork and 1-3-5s motion capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --check tools/section7-method-audit.mjs
      - name: Capture source and local Gallery artwork, geometry, and timeline
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/section7-screenshot-server.log 2>&1 &
          node tools/section7-method-audit.mjs
      - name: Compare image pairs with photo regions excluded
        run: |
          python -m pip install Pillow
          python tools/section7-screenshot-compare.py
      - name: Preserve screenshots and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section7-four-size-screenshot-evidence
          path: section7-method-evidence/
          if-no-files-found: warn
          retention-days: 7
