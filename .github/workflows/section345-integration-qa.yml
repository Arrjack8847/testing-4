name: Sections 3–5 integrated mobile QA
on:
  push:
    branches:
      - feat/section345-integration-preview-20261104
    paths:
      - index.html
      - section-couple.css
      - section-three.css
      - order-program.css
      - order-program.js
      - tests/section345-integration.spec.mjs
      - tests/section5-order-of-day.spec.mjs
      - tests/section-three.spec.mjs
      - .github/workflows/section345-integration-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-phone-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Stage existing opening-scene source art ephemerally
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import re
          names=re.findall(r'^([a-z0-9_]+\.webp)$',Path('ASSET-MANIFEST.txt').read_text(),re.M)
          assert len(names)==25
          Path('assets').mkdir(exist_ok=True)
          for name in names:
            data=urlopen(Request('https://undangankahwin.com/images/concierge/packs/tasik-kayangan/'+name,headers={'User-Agent':'Mozilla/5.0'}),timeout=45).read()
            assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
            Path('assets',name).write_bytes(data)
          PY
      - run: npm run test:syntax
      - name: Section 3-5 integrated regression across four phones
        run: |
          npx playwright test tests/section345-integration.spec.mjs tests/section-couple.spec.mjs tests/section-three.spec.mjs tests/section5-order-of-day.spec.mjs tests/section-four.spec.mjs tests/section-five.spec.mjs --workers=2
      - name: Upload integrated transition evidence and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section345-integrated-320-360-390-430
          path: |
            test-results/**/*.png
            test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 7
