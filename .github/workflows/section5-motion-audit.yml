name: Audit reference Section 5 ambient motion
on:
  push:
    branches: [feat/section5-order-of-day-reference-20261103]
    paths:
      - tools/audit-section5-motion.mjs
      - .github/workflows/section5-motion-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Read-only mobile reference motion sampling
        run: node tools/audit-section5-motion.mjs
      - name: Retain measured motion and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section5-reference-motion-evidence
          path: section5-motion-evidence/
          retention-days: 7
          if-no-files-found: warn
