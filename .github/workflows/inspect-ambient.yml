name: Inspect reference ambient effects
on:
  push:
    paths:
      - tools/inspect-ambient.py
      - .github/workflows/inspect-ambient.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/inspect-ambient.py
